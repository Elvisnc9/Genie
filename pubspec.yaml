name: genie
description: "Genie: design the room you're in. AR interior design with true-to-scale furniture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State management.
  flutter_riverpod: ^3.3.2
  # Declarative routing.
  go_router: ^17.5.0
  # Lucide icon set (1.8 stroke, round caps).
  lucide_icons_flutter: ^3.1.22
  # Settings and the onboarding flag (Phase 2+).
  shared_preferences: ^2.5.3
  # Camera permission flow (Phase 2).
  permission_handler: ^12.0.1
  # AR (ARCore on Android): vendored fork with a centre-screen hit test.
  ar_flutter_plugin_plus:
    path: packages/ar_flutter_plugin_plus
  vector_math: ^2.2.0
  # App version for the Settings footer.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/
    - assets/data/
    - assets/models/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
